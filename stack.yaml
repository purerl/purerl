resolver: lts-23.18
pvp-bounds: both
packages:
  - .
ghc-options:
  # Build with advanced optimizations enabled by default
  "$locals": -O2 -Werror
extra-deps:
  - aeson-better-errors-0.9.1.3
  - bower-json-1.1.0.0
  - haskeline-0.8.2.1
  - language-javascript-0.7.0.0
  - github: purescript/purescript
    commit: 8ac0fb2962a7df318a74216872465dc2868c6064
  - github: purescript/cheapskate
    commit: 633c69024e061ad956f1aecfc137fb99a7a7a20b

flags:
  aeson-pretty:
    lib-only: true
  haskeline:
    # Avoids a libtinfo dynamic library dependency
    terminfo: false
    examples: false
  # Building on certain CentOS (maybe ghc) versions
  cryptonite:
    use_target_attributes: false